name: dsync
description: "Bidirectional file sync between two replicas. See SPEC.md."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.1.0+1

environment:
  # Pinned, not a range: the version this pubspec is developed and gated
  # against. The wire protocol and archive format are the Rust core's now
  # (native/), not this SDK's.
  sdk: 3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  crypto: ^3.0.7

  # Kept only for benchmark/interleaved_pairs.dart's own flag parsing now
  # that the Dart CLI, which this was pinned for (SPEC §3's cross-host
  # protocol identity), is gone. No protocol reason to pin it exactly any
  # more; left at its prior version rather than floated in this change.
  args: 2.7.0

  # Pure path-manipulation library (no I/O, no platform detection), used
  # directly by integration_test/head_pairs_and_syncs_with_cli_test.dart to
  # build scratch paths.
  path: ^1.9.1

  # Pinned, not a range (SPEC §3, same rationale as the other pins above):
  # this is the QR *encoder* `dsync pair show`'s terminal renderer draws over
  # (task e17997) — see that renderer's own doc comment
  # (`native/cli/src/qr.rs`) for why this is a dependency
  # rather than the hand-roll `self_signed_certificate.dart` chose for the
  # X.509 assembly next to it. Pure Dart, one transitive dependency (`meta`,
  # already resolved into this project through `flutter` itself, so this adds
  # nothing to the closure), no Flutter SDK dependency — it runs the same on
  # every v1 target (SPEC §3) including the four with no `app` head.
  qr: 4.0.0

  # The QR *decoder* the Pair page scans a `dsync pair show` code with — the
  # camera as a second input method beside the pasted text (SPEC §16). Not to
  # be confused with `qr` above, which is the *encoder* the CLI renders
  # `dsync pair show`'s terminal symbol with: one turns a payload into a
  # symbol, the other turns a symbol back into a payload, and neither
  # replaces the other. Pinned for the same reason as everything else here
  # (§3), plus the one below: this is a platform-channel plugin, so the pin
  # fixes the Android, iOS and macOS code that opens the camera, not only the
  # Dart call `lib/app/features/pair/` makes. Its Dart side reaches the
  # camera through `MobileScanner`; nothing under `native/` imports it, so
  # the Rust-only builds are untouched (§3).
  mobile_scanner: 7.4.2

  # The platform directory picker the Run setup page offers for a local
  # replica root outside the app's own container (task eb35c3). Pinned for
  # the same reason `mobile_scanner` above is: it is a platform-channel
  # plugin, so the pin fixes the native code that launches
  # `ACTION_OPEN_DOCUMENT_TREE` and converts the tree URI it returns into a
  # path, which is the half of this that decides whether `dart:io` has
  # anything openable to probe. Nothing under `native/` imports it.
  file_picker: 13.1.0

  # Requests the one permission that makes a picked path openable through
  # `dart:io` on targetSdk 30+ — Android's All-files access
  # (`MANAGE_EXTERNAL_STORAGE`, declared in
  # `android/app/src/main/AndroidManifest.xml`). The picker's own grant
  # covers the `content://` tree URI, not the path; a run's scan and apply
  # steps open paths. Pinned for the same platform-channel reason as
  # the plugins above: the native side is what actually shows the Settings
  # screen and reports what the user chose there.
  # 12.0.1, not 13.x: `permission_handler_android` 14 compiles against
  # Android SDK 37, which the Android Gradle plugin this project builds with
  # (9.1.0) will not compile an app against, so a 13.x pin fails
  # `checkDebugAarMetadata` before any Dart runs. 12.0.1's Android half
  # compiles against 36 and the API used here (`manageExternalStorage`,
  # `storage`, `openAppSettings`) is identical.
  permission_handler: 12.0.1

  # Keeps the screen on for as long as a run is live on the mobile head, so
  # the screen timeout cannot suspend the process in the middle of an apply
  # loop (SPEC §11.4). Pinned for the same platform-channel reason as the
  # plugins above: what it sets is an Android window flag
  # (`FLAG_KEEP_SCREEN_ON`) and an iOS `isIdleTimerDisabled`, both native
  # code, and neither needs a permission. It does not — and cannot — stop a
  # user who presses the power button; that case is the lifecycle pause in
  # `run_controller.dart`, and the two are complementary halves of the same
  # requirement. Nothing under `native/` imports it, so the Rust-only builds
  # are untouched (§3). It brings `http`
  # and `package_info_plus` into the closure (its web half reads the browser's
  # user agent); both are transitive and neither is imported here.
  wakelock_plus: 1.8.0

  # Pinned, not a range (SPEC §3, same rationale as the other pins above),
  # and this one is the odd dependency out: it is a platform-channel plugin,
  # not pure Dart. Its Dart side is a single call
  # (`getApplicationSupportDirectory`) the Flutter head makes at one edge
  # (`lib/app/app_paths.dart`) to learn the base directory that
  # `HostSuppliedStateDir` / `HostSuppliedConfigDir` exist to be handed
  # (SPEC §8.3, §12); its native side is the Android and iOS code that
  # actually answers. So the pin fixes the native half too: a range here
  # would let two builds of the head resolve different plugin
  # implementations, and a directory that moves between builds is a device
  # identity — and every pairing recorded against it — that is no longer
  # found, not a cosmetic difference. Nothing under `native/` imports it;
  # only the app head does.
  # The allocator `dart:ffi` itself does not ship for that reason:
  # `benchmark/dir_stat_probe.dart`'s `ffi-*` rungs call libc `stat`,
  # `fstatat` and `getdents64` directly, and that needs C strings, which
  # means `malloc` and `free`. Pure Dart over `dart:ffi`, no native build
  # step, no plugin. Pinned, not a range, for the reason every other pin
  # here gives.
  ffi: 2.2.0

  path_provider: 2.1.6
  # The iOS/macOS half of `path_provider` above, pinned one step below its
  # current release on purpose, and named here rather than left to resolve
  # because a caret would take that step. 2.6.0 swapped the plugin-based
  # implementation for direct FFI through `objective_c`, which carries a
  # Dart *build hook* this project's toolchain has not been verified
  # against. 2.5.1 is the last plugin-based release; revisit this pin next
  # time `path_provider` needs a bump.
  path_provider_foundation: 2.5.1

  # The Flutter head's bridge to the Rust core in native/ (task 07876c
  # spike). An FFI plugin with no Dart build hook. Pinned to the `rinf`
  # crate's version in native/hub/Cargo.toml: the two halves speak one ABI.
  rinf: 8.10.1
  # Imported by the Dart code `rinf gen` writes (lib/app/rust/bindings);
  # pinned for the reason every pin here gives.
  meta: 1.19.0
  tuple: 2.0.2

# rinf 8.10.1 as published, with its Cargokit Gradle task patched for Gradle 9
# (third_party/rinf/PATCHED.md). Drop this once rinf ships the fix.
dependency_overrides:
  rinf:
    path: third_party/rinf

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  test: ^1.31.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# `rinf gen` (SPEC.md §13) writes the Dart side of native/hub's signals
# here; committed, so the app builds and analyzes without the rinf CLI.
rinf:
  gen_input_crates:
    - hub
  gen_output_dir: lib/app/rust/bindings
