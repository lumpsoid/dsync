# The Rust half of dsync (task rust-core-port): `dsync-domain` (pure rules),
# `dsync-core` (the I/O core being rewritten), the `dsync-rs` CLI, the rinf
# hub the Flutter head loads, and the quarantined `dsync-spike` (the original
# spike core; the cli and hub still build against it until later phases
# replace it module by module). See NOTES.md.
#
# rinf's own template puts this workspace at the Flutter project root; it
# lives here instead so the Rust tree is one self-contained directory.
# Cargokit builds `native/hub` by its manifest path, so it finds this
# workspace (and this Cargo.lock) as the hub's parent.

[workspace]
resolver = "3"
members = ["domain", "core", "cli", "hub", "spike"]

[workspace.dependencies]
dsync-domain = { path = "domain" }
dsync-core = { path = "core" }
dsync-spike = { path = "spike" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
toml = { version = "0.9", default-features = false, features = ["parse", "display", "serde", "std"] }
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
ring = "0.17"
x509-parser = "0.16"
pem = "3"
time = { version = "0.3", features = ["std", "formatting", "parsing"] }
if-addrs = "0.14"
