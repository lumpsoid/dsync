# The Rust half of dsync (task 07876c spike): the core library, the
# `dsync-rs` CLI, and the rinf hub the Flutter head loads. See NOTES.md.
#
# rinf's own template puts this workspace at the Flutter project root; it
# lives here instead so the Rust tree is one self-contained directory.
# Cargokit builds `native/hub` by its manifest path, so it finds this
# workspace (and this Cargo.lock) as the hub's parent.

[workspace]
resolver = "3"
members = ["core", "cli", "hub"]

[workspace.dependencies]
dsync-core = { path = "core" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio = { version = "1", default-features = false }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
anyhow = "1"
