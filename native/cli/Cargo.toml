[package]
name = "dsync-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The `dsync` command line (SPEC §11): `sync`, `status` and `agent` over
# dsync-core. Every decision is dsync-domain's; this crate parses argv,
# reads the host's facts once, wires the core's flows and renders them.
[[bin]]
name = "dsync"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
dsync-core.workspace = true
dsync-domain.workspace = true
dsync-version.workspace = true
gethostname = "1"
qrcode = { version = "0.14", default-features = false }
serde_json.workspace = true
time = { workspace = true, features = ["local-offset", "formatting", "macros"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "io-std", "io-util", "time", "sync", "net"] }

[dev-dependencies]
assert_cmd = "2"
dsync-core = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util", "process"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
