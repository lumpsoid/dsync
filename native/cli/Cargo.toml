[package]
name = "dsync-cli"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "dsync-rs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap = { version = "4", features = ["derive"] }
# The slow-create simulation is for local runs only (core/src/slow_create.rs,
# `serve --simulate-create-ms`); the hub, which ships, never enables it.
dsync-core = { workspace = true, features = ["simulate-slow-create"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync"] }
