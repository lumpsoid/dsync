[package]
# rinf's build (cargokit) expects this crate at native/hub under this name.
name = "hub"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

# The Flutter head's way into dsync-core (plan D10): intent-named commands
# in, one reply per command out, and three session streams. Thin by rule:
# decode a signal, call a core flow, encode what it returned. See
# src/lib.rs.

[lib]
# `lib` for tests, `cdylib` for Linux, Android, Windows, `staticlib` for
# iOS and macOS.
crate-type = ["lib", "cdylib", "staticlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"

[dependencies]
dsync-core.workspace = true
dsync-domain.workspace = true
# `catch_unwind` on a future: a panic in a command or session becomes its
# Failed answer instead of a reply that never comes.
futures-util.workspace = true
rinf = "=8.10.1"
serde.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
dsync-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }

[target.'cfg(unix)'.dev-dependencies]
# mkfifo and a non-blocking open: a FIFO holds a compare's read in flight.
libc = "0.2"
