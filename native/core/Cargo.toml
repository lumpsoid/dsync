[package]
name = "dsync-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
dsync-domain.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
thiserror.workspace = true
rcgen.workspace = true
ring.workspace = true
x509-parser.workspace = true
pem.workspace = true
time.workspace = true
if-addrs.workspace = true
subtle.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
tokio-util.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "io-util", "io-std", "net", "process", "time", "macros"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `test-support` exposes what only tests may call, such as
# `ArchiveStore::open`, which replays a log without the replica's lock.
# Only dev-dependencies enable it, so no shipped build compiles it.
[features]
test-support = []

[dev-dependencies]
dsync-core = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "test-util"] }
