timeout: 10s

# The suites that need the real CLI, kept out of a default run.
#
# `test/support/dsync_binary.dart` AOT-compiles `bin/dsync.dart` behind a lock
# file the first time one of these runs after a source change, then spawns it.
# That compile is minutes of silence on a bare `flutter test` with no output to
# say what it is doing, and it is paid by whoever touches `lib/` — which is
# everyone, on every edit, including the runs that have nothing to do with the
# CLI.
#
# Tagged by *cost*, not by name: `pair_then_sync_e2e_test.dart` and
# `agent_listener_secure_e2e_test.dart` are end-to-end too and are not tagged,
# because they run in-process over real sockets and finish in a second.
#
# CI runs both halves — see `.github/workflows/test.yml`. Excluding these by
# default is about the edit loop, not about trusting them less: they are the
# only place a real `dsync agent`, a real unix socket and a real SIGINT are
# exercised at all.
#
#   flutter test                              the fast loop
#   flutter test --tags e2e --run-skipped     the rest
#
# **`skip`, not `exclude_tags`, and the reason is `flutter test`.** A file-level
# `exclude_tags` cannot be turned back off from the command line — `flutter
# test` exposes only `--tags` and `--exclude-tags`, no `--preset` — so
# `--tags e2e` would intersect with the exclusion and run nothing at all,
# silently. A skip is overridable with `--run-skipped`, and a skipped test is
# *named in the output* rather than vanishing from it, which is the difference
# between coverage that is opt-in and coverage that is quietly gone.
tags:
  e2e:
    skip: 'needs the real CLI: run with --tags e2e --run-skipped'
    # Well above the 10s above: these compile a binary and drive real
    # processes, and `convergence_soak_test.dart` sets its own higher one
    # again on top of this.
    timeout: 5m
