# Cross-compiling for the phone (`cargo build --release --target
# aarch64-linux-android`): the NDK's clang as the linker, and as the C
# compiler and archiver ring's build script uses. Adjust the NDK path to your
# install.
[target.aarch64-linux-android]
linker = "/home/qq/.local/share/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"

[env]
CC_aarch64_linux_android = "/home/qq/.local/share/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android30-clang"
AR_aarch64_linux_android = "/home/qq/.local/share/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
