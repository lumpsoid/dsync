# Builds and publishes a release on a version tag (RELEASING.md).
#
# `verify` refuses a tag that is not vX.Y.Z of pubspec.yaml's version. Each
# build job runs scripts/release.sh for the targets its OS builds, which
# writes dist/X.Y.Z/. `publish` gathers every job's files, writes one
# SHA256SUMS over all of them and creates the GitHub release, with the tag's
# annotation (the changelog section scripts/tag-release.sh put there) as its
# notes.
#
# The release keystore arrives base64-encoded in the ANDROID_KEYSTORE_BASE64
# secret and is decoded into $RUNNER_TEMP only for the build;
# scripts/release-android.sh refuses anything not signed by the dsync release
# key. A missing secret fails the run: a debug-signed APK is never published.
#
# UNTESTED until the first tag is pushed to GitHub.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  verify:
    name: tag matches the version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag is vX.Y.Z of pubspec.yaml
        run: |
          scripts/version.sh check
          version=$(scripts/version.sh show)
          version=${version%+*}
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match pubspec.yaml's $version"
            exit 1
          fi

  android:
    name: signed Android release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # cargokit builds native/hub for each Android ABI.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android

      - run: flutter pub get

      - name: Decode the release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "::error::release signing secrets are missing; see RELEASING.md"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build and verify
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: scripts/release.sh android

      - name: Remove the keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-android
          path: dist/*/dsync-*
          if-no-files-found: error

  desktop:
    name: desktop and CLI (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            targets: linux cli cli-linux-arm64
          - os: macos-latest
            targets: macos cli
          - os: windows-latest
            targets: windows cli
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev gcc-aarch64-linux-gnu

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'Linux' && 'aarch64-unknown-linux-musl' || '' }}

      - run: flutter pub get

      - run: scripts/release.sh ${{ matrix.targets }}

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/*/dsync-*
          if-no-files-found: error

  publish:
    name: publish the GitHub release
    needs: [android, desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # actions/checkout fetches the tag as a lightweight ref, dropping its
      # annotation; fetch the tag object itself to read the notes.
      - name: Release notes from the tag
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents:body)' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          if [ ! -s "$RUNNER_TEMP/notes.md" ]; then
            echo "::error::tag $GITHUB_REF_NAME has no annotation body; tag with scripts/tag-release.sh"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: release
          merge-multiple: true

      - name: Checksums
        run: |
          mkdir -p upload
          find release -type f -name 'dsync-*' -exec mv {} upload/ \;
          cd upload
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          name: dsync ${{ github.ref_name }}
          body_path: ${{ runner.temp }}/notes.md
          files: upload/*
          fail_on_unmatched_files: true
