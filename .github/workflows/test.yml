# The whole suite on every desktop v1 target (SPEC §3). macOS and Windows have
# no other machine running these tests, so this matrix is where their answers
# to the platform questions §3 raises — mode bits, `chmod`, path spelling,
# case folding — are actually observed rather than reasoned about.
#
# Flutter is pinned to the release whose bundled Dart is exactly the
# `sdk: 3.13.7` pubspec.yaml pins (3.47.9).
#
# `cargo` gates native/ (the Rust workspace: dsync-domain, dsync-core,
# dsync-cli and hub) on the same three OSes — the CLI and the core now live
# there, not in `lib/`.
name: test

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.9

jobs:
  # pubspec.yaml and every shipped crate name the same version.
  versions:
    name: version files agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/version.sh check

  flutter-test:
    name: flutter test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          # Caches the SDK and the pub cache, keyed on pubspec.lock.
          cache: true

      - run: flutter --version

      - run: flutter pub get

      - run: dart analyze

      - run: flutter test

  cargo:
    name: cargo (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: native
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - run: cargo fmt --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo build --workspace --all-targets

      - run: cargo test --workspace

      # dsync-domain must stay pure: no tokio, no I/O (CLAUDE.md, D1).
      - name: dsync-domain has no tokio dependency
        shell: bash
        run: "! cargo tree -p dsync-domain -e normal | grep -q tokio"

  # RustSec advisories against native/Cargo.lock; ignores live in native/deny.toml.
  # The lockfile is shared by every OS, so one Linux run covers it.
  cargo-deny:
    name: cargo deny advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: native/Cargo.toml
          command: check advisories
